name: Port Scanner.
authors:
  - name: ''
    handle: '@424f424f'
    link: https://twitter.com/424f424f
description: |
  Performs network port scanning to identify open ports and services on target
  systems. Supports multiple target formats including single IP addresses,
  IP ranges (0-255), and CIDR notation for efficient network reconnaissance.
  Supports port ranges (e.g., 10-25) and comma-separated lists (e.g., 80,443).
  Uses socket connections to determine port status.
software: ''
tactics: [TA0007]
techniques: [T1046]
background: true
output_extension:
needs_admin: false
opsec_safe: true
language: python
min_language_version: '3'
comments:
  - CIDR Parser credits to http://bibing.us.es/proyectos/abreproy/12106/fichero/ARCHIVOS%252Fservidor_xmlrpc%252Fcidr.py
options:
  - name: Agent
    description: Agent to execute module on.
    required: true
    value: ''
  - name: Target
    description: Targets to scan in single, range 0-255 or CIDR format.
    required: true
    value: ''
  - name: Ports
    description: The port(s) to scan for (e.g. 80,443,10-25).
    required: true
    value: '8080'
  - name: Threads
    description: The number of threads to use for scanning.
    required: true
    value: '1'
script: |-
  import socket
  from concurrent.futures import ThreadPoolExecutor

  iplist = []


  def set_iprange(addressrange): # converts a ip range into a list
      first3octets = '.'.join(addressrange.split('-')[0].split('.')[:3]) + '.'
      for i in range(int(addressrange.split('-')[0].split('.')[3]),int(addressrange.split('-')[1])+1):
          iplist.append(first3octets+str(i))
      return iplist


  def ip2bin(ip):
      b = ""
      inQuads = ip.split(".")
      outQuads = 4
      for q in inQuads:
          if q != "":
              b += dec2bin(int(q),8)
              outQuads -= 1
      while outQuads > 0:
          b += "00000000"
          outQuads -= 1
      return b


  def dec2bin(n,d=None):
      s = ""
      while n>0:
          if n&1:
              s = "1"+s
          else:
              s = "0"+s
          n >>= 1
      if d is not None:
          while len(s)<d:
              s = "0"+s
      if s == "": s = "0"
      return s


  def bin2ip(b):
      ip = ""
      for i in range(0,len(b),8):
          ip += str(int(b[i:i+8],2))+"."
      return ip[:-1]


  def set_cidr(c):
      parts = c.split("/")
      baseIP = ip2bin(parts[0])
      subnet = int(parts[1])

      if subnet == 32:
          print(bin2ip(baseIP))

      else:
          ipPrefix = baseIP[:-(32-subnet)]
          for i in range(2**(32-subnet)):
              iplist.append(bin2ip(ipPrefix+dec2bin(i, (32-subnet))))
          return


  def portscan(target, port):
      try:
          s = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
          s.settimeout(0.1)
          s.connect((target, port))
      except Exception:
          failvar = 0
          print("Host {} {}/tcp closed".format(target, port))
      else:
          print("Host {} {}/tcp open".format(target, port))
      finally:
          s.close()


  def parse_ports(ports_str):
      """Parses a port string (e.g., '80,443,10-25') into a list of integers."""
      ports = []
      for part in ports_str.split(','):
          part = part.strip()
          if '-' in part:
              try:
                  start, end = map(int, part.split('-'))
                  ports.extend(range(start, end + 1))
              except ValueError:
                  print("Error: Invalid port range format: {}".format(part))
          else:
              try:
                  ports.append(int(part))
              except ValueError:
                  print("Error: Invalid port format: {}".format(part))
      return ports


  def main(target, ports_str, threads):
      ports = parse_ports(ports_str)
      if '/' in target:
          set_cidr(target)
      elif '-' in target:
          set_iprange(target)
      else:
          iplist.append(target)

      tasks = []
      for port in ports:
          for ip in iplist:
              tasks.append((ip, port))

      with ThreadPoolExecutor(max_workers=threads) as executor:
          for ip, port in tasks:
              executor.submit(portscan, ip, port)

  target = "{{ Target }}"
  port_str = "{{ Ports }}"
  threads = int("{{ Threads }}")

  main(target, port_str, threads)
